name: Desktop validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:manager
      - run: npm run test:repository
      - run: npm run pack:plugin
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desk-buddy-${{ matrix.platform }}
          path: release/dsh-desk-buddy-*-${{ matrix.platform }}.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desk-buddy-*
          merge-multiple: true
          path: release
      - name: Publish verified plugin packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) throw new Error("Tag and package version must match")'
          cd release
          sha256sum *.tgz > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.tgz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "dsh-desk-buddy $GITHUB_REF_NAME" --notes-file ../docs/release-notes.md
