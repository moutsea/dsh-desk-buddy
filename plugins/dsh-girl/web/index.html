<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Girl · 桌宠管理</title>
    <link rel="stylesheet" href="/dsh-girl/manager.css" />
    <script type="module" src="/dsh-girl/manager.js"></script>
  </head>
  <body>
    <main>
      <span class="eyebrow">DEEPSEEK GIRL</span>
      <h1>你的桌面小搭档</h1>
      <p class="intro">从这里唤醒 DSG，一起对话、工作，也一起庆祝。</p>
      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="dot"></span>
        <div>
          <strong id="phase">正在读取状态…</strong>
          <p id="connection">自动连接当前 DSH</p>
        </div>
        <small id="version"></small>
      </section>
      <p id="error" role="alert" hidden></p>
      <div class="actions" aria-label="桌宠操作">
        <button data-action="start" class="primary">启动 DSG</button>
        <button data-action="chat">打开对话</button>
        <button data-action="show">显示桌宠</button>
        <button data-action="hide">暂时隐藏</button>
        <button data-action="stop" class="stop">关闭 DSG</button>
      </div>
      <label class="preference"
        ><span>随 DSH 启动<small>启用插件时自动唤醒 DSG</small></span
        ><input
          id="auto-start"
          type="checkbox"
          role="switch"
          aria-label="随 DSH 启动"
      /></label>
      <p class="note">
        角色大小、表情和置顶可在 DSG 的设置气泡里调整。关闭桌宠不会停止 DSH
        中的任务。
      </p>
    </main>
  </body>
</html>
